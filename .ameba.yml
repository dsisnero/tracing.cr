Excluded:
  - temp/**/*
  - lib/**/*
  - vendor/**/*

Lint/NotNil:
  Enabled: false

Style/ParenthesesAroundCondition:
  Enabled: true

Lint/UselessAssign:
  Excluded:
    - spec/**/*_spec.cr

# Per-file: LevelFilter.parse is a direct port of Rust FromStr with multiple
# match arms for numeric and string variants. Splitting would fragment the port.
Metrics/CyclomaticComplexity:
  Excluded:
    - src/tracing/core/types.cr
    - src/tracing/subscriber/fmt.cr
